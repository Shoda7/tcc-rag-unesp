services:
  db:
    image: pgvector/pgvector:pg16
    container_name: tcc-pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tcc_rag
    ports:
      # Host 5433 -> container 5432 (5432 do host ja esta em uso por outro projeto)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tcc_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
